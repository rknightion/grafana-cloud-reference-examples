# The gate. `ci-success` is the single required status check, so the job list
# here can change without touching branch protection.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    # The acceptance evidence check runs in pr-metadata.yml, so editing a pull request body does not
    # re-run this workflow.
    types: [opened, reopened, synchronize, ready_for_review]
  # Lets the gate be re-run without a commit.
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Only the newest commit's result matters, except on main where every commit
  # is a potential release point.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Pull requests only: the same workflow files were already linted when the pull request ran, so
  # a re-run on the push to main repeats the work. ci-success treats the skipped job as a pass.
  actionlint:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/actionlint.yml@c2c3d98e29e9f340620d8ef396a8e6dcb45bda68 # v1.37.0

  # `just check` is the whole local gate, and this job is what makes it enforced
  # rather than aspirational. Not using the shared just-check reusable: that
  # replaces a whole job and cannot install a language toolchain, and this gate
  # needs Python, Node and Terraform on the same runner.
  gate:
    name: just check
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `just check` runs the publication scan, which walks every reachable
          # revision. At the default depth of 1 that is a single commit, so the
          # history half of the scan would pass while covering nothing.
          fetch-depth: 0

      - name: Ensure ripgrep
        # The publication scan refuses to run without it rather than silently
        # matching nothing, so a missing rg fails the gate loudly - but it is
        # cheaper to install it than to rely on the runner image keeping it.
        run: command -v rg >/dev/null 2>&1 || sudo apt-get install -y ripgrep

      - name: Install just
        uses: rknightion/.github/.github/actions/setup-just@c2c3d98e29e9f340620d8ef396a8e6dcb45bda68 # v1.37.0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          # Read from .python-version, so the CI interpreter matches the runtime
          # the examples target.
          python-version-file: .python-version

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # Keep in step with the TERRAFORM_VERSION pin in the justfile. Both
          # sides pinning is safe here because they pin the same value; a
          # mismatch shows up as a fmt or validate failure, not silently.
          terraform_version: v1.17.2
          terraform_wrapper: false

      - name: Install tflint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0

      - name: Install dependencies
        run: just setup
        env:
          # tflint fetches its plugins from the GitHub releases API, which
          # rate-limits unauthenticated requests.
          GITHUB_TOKEN: ${{ github.token }}

      - run: just check
        env:
          # The identity half of the publication scan takes its pattern set by
          # environment, because that set names specific customers and stacks
          # and must never be committed here. Without it the scan exits 2 rather
          # than passing, so a missing secret fails the gate loudly.
          #
          # A pull request from a fork gets no secrets, so it cannot run this
          # half. That is deliberate: such a PR needs a maintainer to re-run the
          # scan locally before merge, and it is never a basis for a visibility
          # change.
          CUSTOMER_IDENTIFIER_PATTERN: ${{ secrets.CUSTOMER_IDENTIFIER_PATTERN }}
          GCRE_SCAN_ALLOW_MISSING_PATTERNS: ${{ github.event.pull_request.head.repo.fork && '1' || '0' }}

  # Build every example's release bundle on every run. A packaging failure that
  # only shows up at release time is a packaging failure found at the worst
  # possible moment.
  package:
    name: package examples
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: rknightion/.github/.github/actions/setup-just@c2c3d98e29e9f340620d8ef396a8e6dcb45bda68 # v1.37.0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version-file: .python-version

      - run: just package-all

      - name: Verify the build is reproducible
        # Two builds of one commit must be byte-identical. Terraform detects new
        # function code by source_code_hash, so a hash that changes on every
        # build makes every apply redeploy unchanged code.
        run: |
          find dist -name '*.zip' -print0 | sort -z | xargs -0 sha256sum > /tmp/first.sha256
          rm -rf dist
          just package-all
          find dist -name '*.zip' -print0 | sort -z | xargs -0 sha256sum > /tmp/second.sha256
          diff /tmp/first.sha256 /tmp/second.sha256

      - name: Upload the bundles for inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-bundles
          path: dist/*.zip
          retention-days: 7

  # The lines a pull request adds carry no identifier, email address, public address or credential
  # shape. The reusable fails on any event but pull_request, so it runs on pull requests only.
  # Check run: `privacy-sweep / Privacy sweep`. Needs no secret, so a fork pull request can pass.
  privacy-sweep:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/privacy-sweep.yml@c2c3d98e29e9f340620d8ef396a8e6dcb45bda68 # v1.37.0

  # zizmor fails a pull request on any finding (enforce); push runs upload SARIF instead.
  zizmor:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: rknightion/.github/.github/workflows/zizmor.yml@c2c3d98e29e9f340620d8ef396a8e6dcb45bda68 # v1.37.0
    with:
      enforce: true

  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [actionlint, gate, package, privacy-sweep, zizmor]
    # contents/pull-requests read: the folded backlog freeze step below lists the pull request's files.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Fail if any required job did not pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        env:
          RESULTS: ${{ join(needs.*.result, ', ') }}
        run: |
          echo "A required job failed or was cancelled: ${RESULTS}"
          exit 1
      # A skipped job reports success, so on a pull request the pull request checks must have
      # actually run and passed.
      - name: Fail if a pull request check did not run
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PRIVACY_SWEEP: ${{ needs.privacy-sweep.result }}
          ZIZMOR: ${{ needs.zizmor.result }}
        run: |
          if [[ "$PRIVACY_SWEEP" != "success" || "$ZIZMOR" != "success" ]]; then
            echo "privacy-sweep: ${PRIVACY_SWEEP}, zizmor: ${ZIZMOR}; all must pass on a pull request"
            exit 1
          fi
      # The Backlog.md board is retired: issues are the queue. A pull request may delete files under
      # backlog/ or move them out, never add or change one there. Folded in here from its own job
      # (a 5 s job that cost a runner start); it still fails ci-success on any offending file. Reads the
      # file list from the API, so no pull request code is checked out.
      - name: Refuse additions and changes under backlog/
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$CHANGED_FILES" =~ ^[0-9]+$ ]]; then
            echo "::error title=backlog freeze::the pull request number or file count is malformed"
            exit 1
          fi
          # The pull request files API lists at most 3000 files; refuse rather than check part of a change.
          if (( CHANGED_FILES > 3000 )); then
            echo "::error title=backlog freeze::${CHANGED_FILES} changed files is more than the API lists; split the pull request"
            exit 1
          fi
          offending="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | select(.status != "removed") | select(.filename | startswith("backlog/")) | "\(.status) \(.filename | @json)"')"
          if [[ -n "$offending" ]]; then
            echo "::error title=backlog freeze::this pull request adds or changes files under backlog/; the board is retired, so file the work as an issue"
            printf '  %s\n' "$offending"
            exit 1
          fi
          echo "No file under backlog/ is added or changed."
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ', ') }}
        run: echo "ci-success - ${RESULTS}"
