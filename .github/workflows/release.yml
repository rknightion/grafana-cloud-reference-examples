# Release automation. On every push to main, release-please maintains one release
# PR per component; merging it tags `<component>-vX.Y.Z`, creates the GitHub
# Release, and the build job below attaches that component's bundle to it.
#
# Dispatching with `tag` rebuilds and re-attaches the bundle for one existing
# release, which is the repair path for a release with missing or wrong assets.
#
# The mint step needs a permission set, policy and JWT role provisioned in the
# secret broker for this repository, plus the TS_WIF_* repository secrets. Those
# are provisioned out of band, per the operator runbook; if the mint step fails,
# that provisioning is what is missing. Nothing else in CI depends on it.
#
# A long-lived cross-repo PAT is deliberately not used here.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild and re-attach, e.g. generic-s3-v1.2.0. Empty runs release-please as normal."
        required: false
        type: string
        default: ""

permissions:
  contents: read

# One shared group for the whole repo, and never cancelled. Two release runs in
# flight would derive the same next version and then fight over the tag, and
# cancelling one mid-publish can leave a release with a half-uploaded asset.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release commit, tag and GitHub Release
      pull-requests: write # open and update the release PRs
      id-token: write # exchanged for a tailnet identity and an OpenBao token
    outputs:
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      # Mints a short-lived GitHub App installation token scoped to THIS repo.
      # The release PR's author becomes the App rather than github-actions[bot],
      # which is what lets CI run on it unattended instead of parking at
      # "action_required".
      - name: Mint a scoped release token
        id: bao
        uses: rknightion/.github/.github/actions/broker-token@c36bf7ded21407b0a5169ecb2502d6a3a385be30 # v1.25.5
        with:
          permission-set: release-please-grafana-cloud-reference-examples
          tailscale-client-id: ${{ secrets.TS_WIF_CLIENT_ID }}
          tailscale-audience: ${{ secrets.TS_WIF_AUDIENCE }}

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.bao.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The tags to build bundles for. Each bundle is built from its own tag,
      # never from the commit that triggered this run: when release merges land
      # back to back, one run can cut several releases, and main at the
      # triggering commit does not hold every released version.
      - name: Plan bundle builds
        id: plan
        env:
          OUTPUTS: ${{ toJSON(steps.release.outputs) }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            # Validated before it is used as a checkout ref.
            [[ "${INPUT_TAG}" =~ ^[a-z0-9]+(-[a-z0-9]+)*-v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || { echo "::error::not a release tag: ${INPUT_TAG}"; exit 1; }
            gh release view "${INPUT_TAG}" --repo "${REPO}" >/dev/null
            tags="$(jq -cn --arg t "${INPUT_TAG}" '[$t]')"
          else
            tags="$(jq -c '[to_entries[] | select(.key | endswith("--tag_name")) | .value]' <<<"${OUTPUTS}")"
          fi
          echo "bundle builds: ${tags}"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

  # Releases anything non-breaking without a human. For every open release PR,
  # either arm GitHub auto-merge, so the PR merges itself once ci-success passes
  # on its current head, or, for a breaking change, disarm it and label it for a
  # manual release. The required check is what "passes the tests" means here;
  # nothing in this job merges directly.
  #
  # A separate job from release-please on purpose: a failure here must not stop
  # attach-bundles from uploading a release that was already cut. It mints its
  # own token because a token cannot cross jobs as an output.
  arm-automerge:
    needs: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # exchanged for a tailnet identity and an OpenBao token
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Must be the App token, never GITHUB_TOKEN. A merge armed by GITHUB_TOKEN
      # fires no push event, so release-please would never run on the merge and
      # the release would sit merged but untagged, with nothing reporting it.
      - name: Mint a scoped release token
        id: bao
        uses: rknightion/.github/.github/actions/broker-token@c36bf7ded21407b0a5169ecb2502d6a3a385be30 # v1.25.5
        with:
          permission-set: release-please-grafana-cloud-reference-examples
          tailscale-client-id: ${{ secrets.TS_WIF_CLIENT_ID }}
          tailscale-audience: ${{ secrets.TS_WIF_AUDIENCE }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Arm or hold each release PR
        env:
          GH_TOKEN: ${{ steps.bao.outputs.token }}
          REPO: ${{ github.repository }}
          MANUAL_LABEL: "release: manual"
        run: |
          set -euo pipefail
          gh label create "${MANUAL_LABEL}" --repo "${REPO}" --force \
            --color B60205 --description "Breaking release PR; merge by hand"

          # Only release-please's own branches in this repo. The label alone is
          # not enough: anyone with triage access could put it on another PR.
          # A draft is a human hold, and arming one errors, so drafts are skipped.
          prs="$(gh pr list --repo "${REPO}" --state open --label "autorelease: pending" \
              --json number,title,body,headRefName,isCrossRepository,isDraft,autoMergeRequest \
              --jq '.[] | select(.headRefName | startswith("release-please--")) | select(.isCrossRepository | not) | select(.isDraft | not)')"

          # One PR failing must not leave the rest unhandled: carry on, fail at the end.
          failed=0
          while IFS= read -r pr; do
            [ -n "${pr}" ] || continue
            number="$(jq -r .number <<<"${pr}")"
            title="$(jq -r .title <<<"${pr}")"

            # Title is "chore(main): release <component> <version>".
            component="$(sed -nE 's/^chore\(main\): release (.+) ([0-9]+\.[0-9]+\.[0-9]+.*)$/\1/p' <<<"${title}")"
            next="$(sed -nE 's/^chore\(main\): release (.+) ([0-9]+\.[0-9]+\.[0-9]+.*)$/\2/p' <<<"${title}")"
            path="$(jq -r --arg c "${component}" \
              '.packages | to_entries[] | select(.value.component == $c) | .key' release-please-config.json)"
            current="$(jq -r --arg p "${path}" '.[$p] // empty' .release-please-manifest.json)"

            reason=""
            if [ -z "${component}" ] || [ -z "${path}" ] || [ -z "${current}" ]; then
              # Fail closed: a PR this step cannot parse is never auto-merged.
              reason="could not resolve component or current version from '${title}'"
            elif [ "${next%%.*}" != "${current%%.*}" ]; then
              reason="major version change ${current} -> ${next}"
            # The version cannot carry this on its own: every component is 0.x
            # with bump-minor-pre-major, so a breaking change is a minor bump.
            # release-please writes this heading into the changelog instead.
            elif jq -e '.body | test("BREAKING CHANGE")' <<<"${pr}" >/dev/null; then
              reason="changelog has a BREAKING CHANGES section"
            fi

            if [ -n "${reason}" ]; then
              echo "#${number} ${title}: holding for a manual release (${reason})"
              # Disarm too: auto-merge armed on an earlier, non-breaking head
              # stays armed when release-please rewrites the branch.
              if [ "$(jq -r '.autoMergeRequest != null' <<<"${pr}")" = "true" ]; then
                gh pr merge "${number}" --repo "${REPO}" --disable-auto
              fi
              gh pr edit "${number}" --repo "${REPO}" --add-label "${MANUAL_LABEL}"
            else
              echo "#${number} ${title}: arming auto-merge (${current} -> ${next})"
              gh pr edit "${number}" --repo "${REPO}" --remove-label "${MANUAL_LABEL}" 2>/dev/null || true
              # GitHub refuses to arm a PR that is already mergeable ("is in
              # clean status"), and gh's own fallback loses the race once an
              # earlier merge in this loop moves main. Merge it directly then:
              # the ruleset still requires ci-success, and the App is not a
              # bypass actor, so this cannot skip the tests.
              if ! out="$(gh pr merge "${number}" --repo "${REPO}" --auto --squash 2>&1)"; then
                echo "${out}"
                if grep -q 'is in clean status' <<<"${out}"; then
                  echo "#${number}: already mergeable, merging directly"
                  gh pr merge "${number}" --repo "${REPO}" --squash || failed=1
                else
                  failed=1
                fi
                [ "${failed}" = 0 ] || echo "::error::#${number} ${title}: neither armed nor merged"
              else
                echo "${out}"
              fi
            fi
          done <<<"${prs}"
          exit "${failed}"

  # One job per release tag, so an example's bundle lands on its own release.
  attach-bundles:
    needs: release-please
    if: needs.release-please.outputs.tags != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # upload release assets
    strategy:
      # Never cancel siblings: a failure on one component must not leave another
      # component's release without its asset.
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.release-please.outputs.tags) }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ matrix.tag }}
          persist-credentials: false

      - name: Skip anything that is not an example
        id: scope
        env:
          TAG: ${{ matrix.tag }}
        run: |
          component="${TAG%-v*}"
          if [ -d "examples/${component}" ]; then
            echo "example=${component}" >> "$GITHUB_OUTPUT"
            echo "version=${TAG##*-v}" >> "$GITHUB_OUTPUT"
          else
            # A shared library release has no artefact of its own; consuming
            # examples pick the change up in their own next bundle.
            echo "example=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install just
        if: steps.scope.outputs.example != ''
        uses: rknightion/.github/.github/actions/setup-just@c36bf7ded21407b0a5169ecb2502d6a3a385be30 # v1.25.5

      - name: Install uv
        if: steps.scope.outputs.example != ''
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version-file: .python-version

      - name: Build the bundle
        if: steps.scope.outputs.example != ''
        env:
          EXAMPLE: ${{ steps.scope.outputs.example }}
        run: just package "${EXAMPLE}"

      - name: Attach it to the release
        if: steps.scope.outputs.example != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
          EXAMPLE: ${{ steps.scope.outputs.example }}
          VERSION: ${{ steps.scope.outputs.version }}
        run: |
          set -euo pipefail
          # The tag decides the version, and the build must agree with it. Never
          # derive the tag from whatever was built: a build of the wrong tree
          # then uploads, with --clobber, over an older release's assets.
          bundle="dist/${EXAMPLE}-${VERSION}.zip"
          lambda="dist/${EXAMPLE}-${VERSION}-lambda.zip"
          [ -f "${bundle}" ] && [ -f "${lambda}" ] || {
            echo "::error::${TAG}: expected ${bundle} and ${lambda}; built: $(ls dist)"
            exit 1
          }
          echo "attaching ${bundle} to ${TAG}"
          gh release upload "${TAG}" "${bundle}" "${lambda}" --clobber
