[project]
name = "grafana-cloud-example-adobe-aem"
version = "0.1.0"
description = "Ship Adobe Experience Manager Cloud Service logs from S3 to Grafana Cloud Loki"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"

# grafana-cloud-common is a workspace path dependency and is vendored into the
# zip by `just package adobe-aem`, not installed from an index.
#
# boto3 is NOT bundled: `rely_on_runtime_aws_sdk: true` in example.yaml. This
# function calls only GetObject and GetSecretValue, both stable for years, and
# the exclusion takes the deployment package from ~16 MB to tens of KB. The
# dependency is still declared so the editor, pytest and mypy all resolve it.
dependencies = [
  "grafana-cloud-common",
  "boto3>=1.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adobe_aem"]
