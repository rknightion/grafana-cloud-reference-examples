[project]
name = "grafana-cloud-example-docdb-connection-attribution"
version = "0.3.0"
description = "Attribute open Amazon DocumentDB connections to database users, as OTLP metrics"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"

# grafana-cloud-common is a workspace path dependency and is vendored into the zip by
# `just package docdb-connection-attribution`, not installed from an index. boto3 is bundled
# rather than taken from the Lambda runtime, for the reason generic-s3 gives.
dependencies = [
  "grafana-cloud-common",
  "boto3>=1.40.0",
  "pymongo>=4.15,<5",
  "opentelemetry-sdk>=1.37,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.37,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docdb_connection_attribution"]
